[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-lab"
version = "0.1.0"
description = "Learning path from Python arrays to a small robotics perception pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "matplotlib",
  "opencv-python-headless",
  "pillow",
  "torch==2.14.1+cpu",
  "torchvision==0.29.1+cpu",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
physical-ai-lab = "physical_ai_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
